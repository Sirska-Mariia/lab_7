# Place this file in <repo-root>/.github/workflows/ and keep the lab7 folder name in working-directory.
name: lab7-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyspark==3.5.3 pytest
      - run: pytest -v
        env:
          USE_LOCAL_SPARK: "1"

  dq-gate:
    needs: unit-tests
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t dev
      - run: databricks bundle deploy -t dev
      # `bundle run` waits for the job and exits non-zero if it fails -> failed DQ gate fails the build
      - run: databricks bundle run lab7_dq_suite -t dev
